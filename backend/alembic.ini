[alembic]
script_location = %(here)s/migracoes
version_locations = %(here)s/migracoes/versoes
path_separator = os
# A URL do banco NÃO fica aqui: vem de compartilhado/config.py (variável DATABASE_URL no .env).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
